# Local PostgreSQL for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports:
      - "5432:5432"
    volumes:
      - beauty-pgdata:/var/lib/postgresql/data
volumes:
  beauty-pgdata:
