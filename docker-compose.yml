# Local PostgreSQL for development: `make db-up`
#   beauty     superuser: migrations + RLS tests (MIGRATION_DATABASE_URL, tests)
#   beauty_api limited app login created by docker/initdb (DATABASE_URL)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports:
      # 5433 on the host so a local Postgres on 5432 (Homebrew etc.) never collides.
      - "${BEAUTY_DB_PORT:-5433}:5432"
    volumes:
      - beauty-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  beauty-pgdata:
